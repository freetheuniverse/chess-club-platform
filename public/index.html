<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Club · Club management</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#21332c;background:#f4f6f2}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0}a{color:#126a51;text-decoration:none}.shell{display:flex;min-height:100vh}.side{width:244px;background:#162b25;color:#eaf0eb;padding:25px 17px;flex-shrink:0}.brand{font-size:21px;letter-spacing:-.7px;font-weight:800;margin:2px 8px 30px;display:flex;align-items:center;gap:10px}.mark{width:37px;height:37px;border-radius:11px;background:#c7e2a2;color:#153123;display:grid;place-items:center;font-size:27px}.nav{display:block;border-radius:11px;padding:13px 15px;margin:5px 0;color:#c3d1c8;background:transparent;width:100%;text-align:left}.nav.active,.nav:hover{background:#29463a;color:white}.sidebar-bottom{margin-top:32px;padding:14px 8px;border-top:1px solid #416154;color:#b7cdbf;font-size:12px}.main{width:100%;max-width:1380px;padding:34px 42px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:29px}.eyebrow{font-size:11px;font-weight:800;color:#739484;letter-spacing:1.8px;text-transform:uppercase}h1{font-size:31px;letter-spacing:-1.1px;margin:8px 0 5px}h2{font-size:18px;letter-spacing:-.5px;margin:0 0 17px}h3{font-size:15px;margin:0 0 8px}.muted{color:#728079;font-size:14px}.btn{background:#1d5945;color:white;padding:11px 17px;border-radius:10px;font-weight:650}.btn:hover{background:#134432}.btn.ghost{background:#ecf1eb;color:#325c47}.btn.small{padding:7px 11px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.stat,.panel{background:white;border:1px solid #e4e9e2;border-radius:16px;padding:20px;box-shadow:0 5px 24px rgba(18,43,25,.025)}.stat .number{font-size:31px;font-weight:750;letter-spacing:-1px;margin:15px 0 5px}.stat .muted{font-size:12px}.content-grid{display:grid;grid-template-columns:1.65fr 1fr;gap:17px;margin-top:18px}.stack{display:grid;gap:16px}.card-item{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid #eff2ed}.card-item:last-child{border-bottom:0}.pill{border-radius:99px;padding:5px 10px;background:#ecf4e6;font-size:11px;font-weight:750;color:#3b735a;white-space:nowrap}.pill.draft{background:#f1f2ee;color:#748078}.pill.active{background:#e7effa;color:#37699a}.banner{border-radius:17px;background:#dcebd2;padding:24px 27px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:21px}.banner h2{font-size:21px;margin:0 0 6px}.banner p{font-size:13px;margin:0;max-width:580px;color:#4d6856}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:#7c8981;font-size:11px;text-transform:uppercase;letter-spacing:.7px}th,td{padding:13px 10px;border-bottom:1px solid #edf0eb}tr:last-child td{border-bottom:0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{display:flex;justify-content:space-between;align-items:center;gap:15px}.field{width:100%;padding:12px 13px;border:1px solid #dbe3da;border-radius:10px;background:#fff;outline:none}.field:focus{border-color:#4b8f6e;box-shadow:0 0 0 3px #e9f5ec}.form{display:grid;gap:13px}.form label{font-size:12px;font-weight:700;color:#506257}.form label input{margin-top:6px}.modalcover{position:fixed;inset:0;background:#10221ac4;display:grid;place-items:center;z-index:10;padding:16px}.modal{width:min(450px,100%);background:#fff;padding:27px;border-radius:19px;box-shadow:0 20px 60px #09180b52}.modal h2{font-size:24px}.auth{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top left,#d4e8ca,transparent 60%),#f6f8f4;padding:22px}.auth .modal{box-shadow:0 20px 70px #243b2817}.hint{font-size:12px;color:#7e8880}.notice{background:#fff3dd;color:#815b1b;padding:11px 14px;border-radius:10px;margin-bottom:17px;font-size:13px}.empty{padding:27px;text-align:center;color:#8a958d;border:1px dashed #dfe5dc;border-radius:12px}.selectrow{display:flex;align-items:center;gap:10px;padding:9px;border-bottom:1px solid #eef1eb;font-size:14px}.selectrow input{width:17px;height:17px;accent-color:#24664a}.score{font-weight:800;font-variant-numeric:tabular-nums}.back{font-size:13px;margin-bottom:16px;display:inline-block}.close{background:transparent;font-size:22px;color:#829186}.tag{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#669077;font-weight:800}.interactive{color:#195e49;cursor:pointer;font-weight:750}.interactive:hover{text-decoration:underline}@media(max-width:900px){.side{width:185px}.main{padding:25px}.grid{grid-template-columns:repeat(2,1fr)}.content-grid{grid-template-columns:1fr}}@media(max-width:620px){.shell{display:block}.side{width:100%;padding:11px;display:flex;align-items:center;justify-content:space-between}.brand{margin:0;font-size:16px}.sidebar-bottom{display:none}.side .nav{display:none}.main{padding:20px 15px}.top{align-items:start}.grid{gap:9px}.stat,.panel{padding:14px}.stat .number{font-size:24px}.banner{display:block}.banner .btn{margin-top:14px}h1{font-size:26px}} 
</style>
</head>
<body><div id="app"></div><script>
const state={user:null,clubs:[],club:null,data:null,tournament:null,tdata:null,tab:"overview",modal:null,notice:"",loading:true};
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=x=>x?new Date(x+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):"";
async function api(path,options={}){
 const r=await fetch("/api/"+path,{credentials:"same-origin",...options,headers:options.body?{"Content-Type":"application/json"}:{}});
 const data=await r.json().catch(()=>({error:"Server error"}));if(!r.ok)throw Error(data.error||"Request failed");return data;
}
const post=(path,data={})=>api(path,{method:"POST",body:JSON.stringify(data)});
async function load(){try{let m=await api("auth/me");state.user=m.user;state.clubs=(await api("clubs")).clubs;if(state.club&&!state.clubs.some(c=>c.id===state.club))state.club=null;if(!state.club&&state.clubs.length)state.club=state.clubs[0].id;await refresh();}catch(e){state.user=null;}state.loading=false;render()}
async function refresh(){if(!state.club){state.data=null;return;}state.data=await api("clubs/"+state.club);if(state.tournament)try{state.tdata=await api("clubs/"+state.club+"/tournaments/"+state.tournament)}catch{state.tournament=null;state.tdata=null}}
async function action(fn){try{state.notice="";await fn();await refresh();render()}catch(e){state.notice=e.message;render()}}
function button(label,cmd,cls="btn"){return '<button class="'+cls+'" data-action="'+cmd+'">'+label+"</button>"}
function empty(s){return '<div class="empty">'+esc(s)+"</div>"}
function shell(content){return '<div class="shell"><aside class="side"><div class="brand"><span class="mark">♞</span> Chess Club</div><nav>'+[["overview","Overview"],["tournaments","Tournaments"],["members","Members"],["attendance","Attendance"],["puzzles","Puzzles"]].map(([k,v])=>'<button data-action="tab:'+k+'" class="nav '+(state.tab===k?"active":"")+'">'+v+"</button>").join("")+'</nav><div class="sidebar-bottom">CHESS CLUB PLATFORM<br><br>'+esc(state.user?.name||"")+'<p>'+button("Sign out","logout","btn ghost small")+"</p></div></aside><main class=\"main\">"+content+"</main></div>"}
function top(){let name=state.data?.club?.name||"Your clubs";return '<div class="top"><div><div class="eyebrow">Club workspace</div><h1>'+esc(name)+'</h1><span class="muted">Manage your chess community in one place.</span></div><div class="row"><select id="clubselect" class="field" style="width:auto;max-width:180px">'+state.clubs.map(c=>'<option value="'+c.id+'" '+(c.id===state.club?"selected":"")+'>'+esc(c.name)+'</option>').join("")+'</select>'+button("Join club","join-club","btn ghost")+button("+ New club","new-club","btn")+"</div></div>"}
function overview(){const d=state.data;const ct=d.tournaments.filter(x=>x.status==="active").length;const dates=[...new Set(d.attendance.map(x=>x.event_date))];return '<div class="banner"><div><h2>Welcome back, '+esc(state.user.name.split(" ")[0])+' ♟</h2><p>Your club dashboard is ready. Create tournaments, record results and follow member attendance without duplicate daily entries.</p></div>'+button("+ Create tournament","new-tournament")+'</div><div class="grid">'+[[d.members.length,"Club members","♙"],[d.tournaments.length,"Tournaments","♜"],[ct,"In progress","♞"],[dates.length,"Attendance days","▦"]].map(x=>'<div class="stat"><span class="tag">'+x[2]+" "+x[1]+'</span><div class="number">'+x[0]+'</div><span class="muted">Across this club</span></div>').join("")+'</div><div class="content-grid"><div class="panel"><div class="spread"><h2>Recent tournaments</h2>'+button("View all","tab:tournaments","btn ghost small")+'</div>'+tournamentList(d.tournaments.slice(0,5))+'</div><div class="stack"><div class="panel"><h2>Club access</h2><p class="muted">Invite students to join using your club code.</p>'+(d.role==="moderator"?'<div class="row"><strong style="font-size:23px;letter-spacing:3px">'+esc(d.club.join_code)+'</strong>'+button("Copy","copy-code","btn ghost small")+'</div>':"<p class='muted'>You're a club member.</p>")+'</div><div class="panel"><h2>Upcoming work</h2><p class="muted">Puzzles and student progress analytics are being developed as the next phase.</p><a href="https://lichess.org/training" target="_blank" rel="noopener">Practice chess puzzles ↗</a></div></div></div>'}
function tournamentList(items){return items.length?items.map(t=>'<div class="card-item"><div><div class="interactive" data-action="tournament:'+t.id+'">'+esc(t.title)+'</div><div class="muted">'+date(t.event_date)+' · '+t.player_count+' players</div></div><span class="pill '+esc(t.status)+'">'+esc(t.status)+'</span></div>').join(""):empty("No tournaments yet. Create one to get started.")}
function tournaments(){return '<div class="spread"><h2>All tournaments</h2>'+(state.data.role==="moderator"?button("+ Create tournament","new-tournament"):"")+'</div><div class="panel">'+tournamentList(state.data.tournaments)+'</div>'}
function members(){const d=state.data;return '<div class="spread"><h2>Members</h2><span class="muted">'+d.members.length+' members</span></div><div class="panel tablewrap"><table><thead><tr><th>Name</th><th>Role</th><th>Attendance days</th></tr></thead><tbody>'+d.members.map(m=>'<tr><td><strong>'+esc(m.name)+'</strong></td><td><span class="pill">'+esc(m.role)+'</span></td><td>'+d.attendance.filter(x=>x.user_id===m.id).length+'</td></tr>').join("")+'</tbody></table></div>'}
function attendance(){const d=state.data;return '<h2>Attendance history</h2><div class="panel"><p class="muted">Attendance is added when participants are registered to a tournament on or before its date. The same student can only be counted once per club per day. Future tournaments do not generate attendance early.</p><div class="tablewrap"><table><thead><tr><th>Date</th><th>Student</th></tr></thead><tbody>'+d.attendance.map(x=>'<tr><td>'+date(x.event_date)+'</td><td>'+esc(x.name)+'</td></tr>').join("")+'</tbody></table></div>'+(d.attendance.length?"":empty("Attendance will appear when participants join current or past-date tournaments."))+'</div>'}
function puzzles(){const d=state.data;return '<div class="banner"><div><h2>Chess puzzle practice</h2><p>Build tactical skills through short daily exercises. Puzzle integration and verified attempt tracking will be introduced in a later release.</p></div><a class="btn" href="https://lichess.org/training" target="_blank" rel="noopener">Open Lichess puzzles ↗</a></div><div class="panel"><h2>Puzzle analytics</h2><p class="muted">This area will show attempts, accuracy and progress once a puzzle provider is integrated. We won’t report practice as completed without actual data.</p></div>'}
function tournamentDetail(){const d=state.tdata,t=d.tournament,can=state.data.role==="moderator",completed=t.status==="completed";const unselected=state.data.members.filter(m=>!d.players.some(p=>p.id===m.id));return '<a class="back interactive" data-action="close-tournament">← Back to tournaments</a><div class="spread"><div><div class="eyebrow">Tournament workspace</div><h1>'+esc(t.title)+'</h1><span class="muted">'+date(t.event_date)+' · '+d.players.length+' participants · '+esc(t.status)+'</span></div>'+(can&&!completed?button("Finish tournament","complete-tournament","btn ghost"):"")+'</div><div class="content-grid"><div class="stack"><div class="panel"><div class="spread"><h2>Rounds & pairings</h2>'+(can&&!completed?button("+ Generate round","new-round","btn small"):"")+'</div>'+(d.rounds.length?d.rounds.map(r=>'<div><h3>Round '+r.round_number+'</h3><div class="tablewrap"><table><thead><tr><th>White</th><th>Black</th><th>Result</th></tr></thead><tbody>'+d.games.filter(g=>g.round_number===r.round_number).map(g=>'<tr><td>'+esc(g.white_name)+'</td><td>'+esc(g.black_name||"BYE")+'</td><td>'+(g.result==="bye"?"1 point · bye":can&&!completed?'<select class="field" style="padding:7px;width:auto" data-game="'+g.id+'"><option value="" '+(!g.result?"selected":"")+'>Not played</option>'+[["1-0","White wins"],["0-1","Black wins"],["1/2-1/2","Draw"]].map(([k,v])=>'<option value="'+k+'" '+(g.result===k?"selected":"")+'>'+v+'</option>').join("")+'</select>':esc(g.result||"Pending"))+'</td></tr>').join("")+'</tbody></table></div></div>').join(""):empty("No rounds yet. Add players and generate the first round."))+'</div><div class="panel"><h2>Standings</h2><table><thead><tr><th>#</th><th>Player</th><th>Points</th></tr></thead><tbody>'+d.standings.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(p.name)+'</td><td class="score">'+p.points.toFixed(1)+'</td></tr>').join("")+'</tbody></table></div></div><div class="stack"><div class="panel"><h2>Participants</h2><p class="muted">'+d.players.length+' registered players</p>'+d.players.map(p=>'<div class="card-item">'+esc(p.name)+'</div>').join("")+(d.players.length?"":empty("No participants registered."))+'</div>'+(can&&t.status==="draft"?'<div class="panel"><h2>Add club members</h2><div id="playerchoices">'+(unselected.length?unselected.map(p=>'<label class="selectrow"><input type="checkbox" class="playerpick" value="'+p.id+'">'+esc(p.name)+'</label>').join(""):empty("All club members are enrolled."))+'</div><p>'+button("Add selected players","add-players")+'</p><div class="hint">Each added player receives one attendance record for this date if the tournament date is not in the future.</div></div>':"")+'</div></div>'}
function modal(){if(!state.modal)return "";let mode=state.modal;let title=mode==="new-club"?"Create a chess club":mode==="join-club"?"Join a chess club":"New tournament";return '<div class="modalcover"><div class="modal"><div class="spread"><h2>'+title+'</h2>'+button("×","close-modal","close")+'</div><form id="modalform" class="form">'+(mode==="new-club"?'<label>Club name<input class="field" name="name" placeholder="e.g. SHJC Chess Club" minlength="3" required></label>':mode==="join-club"?'<label>Club join code<input class="field" name="code" placeholder="Enter your code" required></label>':'<label>Tournament name<input class="field" name="title" placeholder="November Club Tournament" minlength="3" required></label><label>Event date<input type="date" class="field" name="event_date" required></label>')+'<button class="btn" type="submit">'+(mode==="join-club"?"Join": "Create")+'</button></form></div></div>'}
function auth(){return '<div class="auth"><div class="modal"><div class="brand" style="color:#173b28;margin-bottom:23px"><span class="mark">♞</span> Chess Club</div><div class="eyebrow">Your chess community</div><h1>Every move matters.</h1><p class="muted">One place for players, tournaments and attendance.</p><form id="authform" class="form"><label id="namefield">Your name<input name="name" class="field" placeholder="Full name" autocomplete="name"></label><label>Email address<input name="email" type="email" class="field" required autocomplete="email"></label><label>Password<input name="password" type="password" class="field" minlength="10" required autocomplete="current-password"></label><button type="submit" class="btn" id="authsubmit">Create account</button></form><p class="muted" style="text-align:center"><span id="authswitch" class="interactive">Already have an account? Sign in</span></p><p class="hint">Accounts are stored privately in your Cloudflare database.</p></div></div>'}
function render(){if(state.loading){$("app").innerHTML='<div class="auth"><h2>Loading chess club…</h2></div>';return}if(!state.user){$("app").innerHTML=auth()+(state.notice?'<div class="notice" style="position:fixed;top:12px;right:12px">'+esc(state.notice)+'</div>':"");bindAuth();return}let content=top();if(state.notice)content+='<div class="notice">'+esc(state.notice)+'</div>';if(!state.club){content+='<div class="banner"><div><h2>Start your first chess club</h2><p>Create a club for moderators or join an existing one as a student.</p></div><div class="row">'+button("Create club","new-club")+button("Join club","join-club","btn ghost")+'</div></div>'}else if(state.tournament&&state.tdata)content+=tournamentDetail();else content+=({overview,tournaments,members,attendance,puzzles}[state.tab]||overview)();$("app").innerHTML=shell(content)+modal();bind();}
function bindAuth(){let signup=true;$("authswitch").onclick=()=>{signup=!signup;$("namefield").style.display=signup?"":"none";$("authsubmit").textContent=signup?"Create account":"Sign in";$("authswitch").textContent=signup?"Already have an account? Sign in":"New here? Create an account"};$("authform").onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);action(async()=>{const result=await post("auth/"+(signup?"register":"login"),Object.fromEntries(f));state.user=result.user;state.clubs=(await api("clubs")).clubs;state.club=state.clubs[0]?.id||null;await refresh()})}}
function bind(){document.querySelectorAll("[data-action]").forEach(el=>el.onclick=()=>{const [a,id]=el.dataset.action.split(":");if(a==="tab"){state.tab=id;state.tournament=null;state.tdata=null;render()}else if(a==="new-club"||a==="join-club"||a==="new-tournament"){state.modal=a;render()}else if(a==="close-modal"){state.modal=null;render()}else if(a==="copy-code"){navigator.clipboard?.writeText(state.data.club.join_code).then(()=>{state.notice="Join code copied";render()})}else if(a==="logout"){action(async()=>{await post("auth/logout");state.user=null;state.club=null;state.data=null;state.tournament=null})}else if(a==="tournament"){action(async()=>{state.tournament=id;state.tdata=await api("clubs/"+state.club+"/tournaments/"+id)})}else if(a==="close-tournament"){state.tournament=null;state.tdata=null;render()}else if(a==="add-players"){action(async()=>{const ids=[...document.querySelectorAll(".playerpick:checked")].map(x=>x.value);await post("clubs/"+state.club+"/tournaments/"+state.tournament+"/players",{user_ids:ids});state.tdata=await api("clubs/"+state.club+"/tournaments/"+state.tournament)})}else if(a==="new-round"){if(!confirm("Generate the next round of pairings?"))return;action(async()=>{await post("clubs/"+state.club+"/tournaments/"+state.tournament+"/rounds");state.tdata=await api("clubs/"+state.club+"/tournaments/"+state.tournament)})}else if(a==="complete-tournament"){if(!confirm("Mark this tournament as completed? Results will become read-only."))return;action(async()=>{await post("clubs/"+state.club+"/tournaments/"+state.tournament+"/complete");state.tdata=await api("clubs/"+state.club+"/tournaments/"+state.tournament)})}});
const select=$("clubselect");if(select)select.onchange=()=>action(async()=>{state.club=select.value;state.tournament=null;state.tdata=null});document.querySelectorAll("[data-game]").forEach(el=>el.onchange=()=>{if(!el.value)return;action(async()=>{await post("clubs/"+state.club+"/tournaments/"+state.tournament+"/games/"+el.dataset.game,{result:el.value});state.tdata=await api("clubs/"+state.club+"/tournaments/"+state.tournament)})});const form=$("modalform");if(form)form.onsubmit=e=>{e.preventDefault();const b=Object.fromEntries(new FormData(form));const mode=state.modal;action(async()=>{let result;if(mode==="new-club"){result=await post("clubs/create",b);state.club=result.id}else if(mode==="join-club"){result=await post("clubs/join",b);state.club=result.club.id}else{result=await post("clubs/"+state.club+"/tournaments",b);state.tournament=result.id;state.tdata=await api("clubs/"+state.club+"/tournaments/"+result.id)}state.clubs=(await api("clubs")).clubs;state.modal=null})}}
render();load();
</script></body></html>
